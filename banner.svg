<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Praveen Yasas - Passionate Developer">
  <title>Praveen Yasas</title>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    .name { font-size: 70px; font-weight: 800; letter-spacing: -1.5px; }
    .typed { font-size: 24px; fill: #e2e8f0; }
    .prompt { font-size: 24px; fill: #67e8f9; font-weight: 700; }
    .pill { font-size: 15px; fill: #cbd5e1; }
    .meta { font-size: 17px; fill: #94a3b8; }
    .code { font-size: 15px; }
    .file { font-size: 13px; fill: #64748b; }
    .blink { animation: blink 1s steps(1) infinite; }
    .float { animation: float 6s ease-in-out infinite; }
    .b1 { animation: drift1 14s ease-in-out infinite; }
    .b2 { animation: drift2 18s ease-in-out infinite; }
    .b3 { animation: drift3 16s ease-in-out infinite; }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: 86px 73px; }
    .rise { animation: rise .9s ease-out both; }
    .rise2 { animation: rise .9s .15s ease-out both; }
    .rise3 { animation: rise .9s .3s ease-out both; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes drift1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(90px, 40px); } }
    @keyframes drift2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-110px, -30px); } }
    @keyframes drift3 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-60px, 50px); } }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.75); } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .blink, .float, .b1, .b2, .b3, .pulse, .rise, .rise2, .rise3 { animation: none; }
    }
  </style>

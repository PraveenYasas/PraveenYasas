name: Update README stats

on:
  schedule:
    - cron: "30 0 * * *" # every day at 6:00 AM Sri Lanka time (00:30 UTC)
  workflow_dispatch: # run it manually from the Actions tab
  push:
    paths:
      - ".github/workflows/readme-stats.yml" # runs once as soon as this file is added/edited

permissions:
  contents: write

concurrency:
  group: readme-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stats card needs a personal access token saved as the STATS_TOKEN repo secret
      - name: Stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=praveenYasas&show_icons=true&count_private=true&theme=tokyonight&hide_border=true
          path: profile/stats-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=praveenYasas&layout=compact&langs_count=8&theme=tokyonight&hide_border=true
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=praveenYasas&theme=tokyonight&hide_border=true
          path: profile/streak-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: praveenYasas
          outputs: |
            profile/snake-dark.svg?palette=github-dark&color_snake=#a78bfa

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README stats cards" || exit 0
          git pull --rebase --autostash
          git push
